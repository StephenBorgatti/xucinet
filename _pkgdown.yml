url: https://stephenborgatti.github.io/xucinet/

template:
  bootstrap: 5

home:
  title: "xucinet: UCINET-style social network analysis in R"
  description: >
    The same routines as UCINET, the same numbers, the same printed output,
    under names that track UCINET's menus.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

articles:
- title: Articles
  navbar: ~
  contents:
  - getting-started
  - crosswalk
  - differences

# Grouped by UCINET's menu rather than alphabetically, so a UCINET user can find
# a function where they would look for the menu item. Sections for menus whose
# routines are not written yet are added as each phase lands, rather than sitting
# here empty.
reference:
- title: Data
  desc: >
    Reading, writing and displaying datasets. UCINET's Data menu, plus the
    file-format routines behind it.
  contents:
  - xread
  - xsave
  - xdisplay
  - xhelp
  - xattributetomatrix
  - xmatch
  - xjoin
  - xunpack

- title: Data | file formats
  desc: >
    One reader and one writer per format. `xread()` and `xsave()` dispatch to
    these; call them directly when you want to be explicit about the format.
  contents:
  - xreaducinet
  - xsaveucinet
  - xreaduci
  - xsaveuci
  - xreaddl
  - xsavedl
  - xreadvna
  - xsavevna

- title: The network object
  desc: >
    The class every routine takes and returns, its coercers, and the way out to
    the rest of the R network ecosystem.
  contents:
  - as_xucinet
  - as_igraph
  - xfromedgelist
  - xfromnodelist
  - xrelations
  - xattributes
  - "`[.xucinet`"

- title: Transform
  desc: >
    Routines that produce a dataset rather than a report, so they chain into
    any other function. Each is titled the way UCINET names the dataset it
    saves, and carries a `history` attribute.
  contents:
  - xtranspose
  - xsymmetrize
  - xdichotomize
  - xnormalize
  - xrecode
  - xcombinenodes
  - xcombine
  - xmultiplex
  - ximpute
  - xreplacemissing

- title: Tools | Similarities & Distances
  desc: Comparing the rows, the columns or the relations of a dataset.
  contents:
  - xsimilarities

- title: Network | Whole Networks
  desc: Whole-network measures.
  contents:
  - xdensity
  - xcohesion
  - xcentralization
  - xhomophily
  - xdensitybygroups
  - xmixing

- title: Network | Cohesion
  desc: >
    Distances, reciprocity and closure. What the network looks like as a
    structure rather than node by node.
  contents:
  - xgeodesic
  - xreciprocity
  - xtransitivity
  - xcyclicality

- title: Network | Regions
  desc: The pieces a network falls into.
  contents:
  - xcomponents

- title: Network | Centrality
  desc: >
    Chapter 9. One function per UCINET menu item; the dialog's checkboxes are
    arguments, and the column headings in the node table are UCINET's own.
  contents:
  - xdegree
  - xbetweenness
  - xcloseness
  - xeigenvector
  - xbeta
  - xpncentrality
  - xcentrality
  - xreach
  - xbetareach
  - xhubsauthorities
  - xinduced
  - xinverseweighteddegree

- title: Network | Subgroups
  desc: >
    Chapter 11. Cliques, and partitions into cohesive groups. Every partition
    routine reports `Cluster` for each node and a `Modularity` computed the
    same way, so the methods can be compared; `xcommunities()` runs all
    five and puts their partitions side by side.
  contents:
  - xcliques
  - xfactions
  - xgirvannewman
  - xlouvain
  - xfastgreedy
  - xlabelpropagation
  - xcommunities

- title: Network | Ego Networks
  desc: >
    Chapter 8. Each node's own neighbourhood: its size and density, how its
    ties and alters are composed, whether alters resemble ego, and Burt's
    structural holes. One `ties` argument says which ties define the
    ego network, with each dialog's own default.
  contents:
  - xegonet
  - xegoreciprocity
  - xstructuralholes
  - xtiecomposition
  - xvaluedtiecomposition
  - xaltercomposition
  - xegoaltersimilarity

- title: Network | Roles & Positions
  desc: >
    Chapter 12. Structural equivalence by profile similarity, and the
    blockmodel of a partition: the blocked matrix, block densities, image
    and fit.
  contents:
  - xstructuralequivalence
  - xblockmodel

- title: Network | Core/Periphery
  desc: >
    Chapter 12.8. The categorical and continuous core/periphery models in one
    function; `type` chooses which is printed.
  contents:
  - xcoreperiphery

- title: Tools | Scaling/Decomposition
  desc: >
    Chapter 6. Multidimensional scaling and correspondence analysis of a
    proximity matrix or a table; `type=` says whether large values mean close
    or far, and has no default.
  contents:
  - xmds
  - xshepard
  - xcorrespondence

- title: Tools | Cluster Analysis
  desc: Chapter 6. Johnson's hierarchical clustering, reported as UCINET reports it.
  contents:
  - xhclust

- title: Datasets
  desc: >
    The datasets the book uses, under their lowercase names. Node attributes are
    plain data frames named `<dataset>_attr`.
  contents:
  - has_keyword("datasets")

- title: internal
  contents:
  - new_xucinet_output
  - print.xucinet_output
  - summary.xucinet_output
  - xnrelations
  - xucinet_1e_names
  - xucinet-1e
